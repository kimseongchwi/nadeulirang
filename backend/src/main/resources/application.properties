spring.application.name=Nadeulirang
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=nadeulirang
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Seoul'
spring.sql.init.mode=never
# 스키마 변경은 Flyway만 수행한다. ORM은 기존 매핑을 검증하고 요청 밖 추가 조회를 막는다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.default-schema=nadeulirang
spring.flyway.schemas=nadeulirang
spring.flyway.clean-disabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false

# 세션 DDL은 Flyway V7만 적용한다. 서버 재시작 뒤에도 JDBC 세션을 유지한다.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
server.servlet.session.timeout=30m
auth.public-origin=${AUTH_PUBLIC_ORIGIN:http://localhost:3000}
auth.secure-cookie=${AUTH_SECURE_COOKIE:false}
auth.terms-version=${AUTH_TERMS_VERSION:}
auth.privacy-version=${AUTH_PRIVACY_VERSION:}
auth.oauth.kakao.client-id=${KAKAO_CLIENT_ID:}
auth.oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
auth.oauth.naver.client-id=${NAVER_CLIENT_ID:}
auth.oauth.naver.client-secret=${NAVER_CLIENT_SECRET:}
auth.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
auth.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
