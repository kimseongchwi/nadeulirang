spring.application.name=Nadeulirang
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.schema=nadeulirang
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Seoul'
spring.sql.init.mode=never
# 스키마 변경은 Flyway만 수행한다. ORM은 기존 매핑을 검증하고 요청 밖 추가 조회를 막는다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.default-schema=nadeulirang
spring.flyway.schemas=nadeulirang
spring.flyway.clean-disabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
