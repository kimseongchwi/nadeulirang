name: 개발 검사
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  changes:
    name: 변경 영역 확인
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      backend: ${{ steps.paths.outputs.backend }}
      tooling: ${{ steps.paths.outputs.tooling }}
    steps:
      - name: 비교 이력 가져오기
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Node.js 준비
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 삭제·이동 포함 검사 선택
        id: paths
        run: node scripts/check-ci-paths.mjs
  check:
    name: 커밋 도구·프론트 검사
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 경로 확인 실패를 성공으로 처리하지 않기
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - name: 저장소 가져오기
        uses: actions/checkout@v7
      - name: Node.js 준비
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 문서 파일·앵커 검사
        run: npm run check:docs
      - name: 커밋 차단 테스트
        if: needs.changes.outputs.tooling == 'true'
        run: npm test
      - name: 프론트 의존성 설치
        if: needs.changes.outputs.frontend == 'true'
        run: npm ci --prefix frontend
      - name: 프론트 코드·타입·빌드 검사
        if: needs.changes.outputs.frontend == 'true'
        run: npm --prefix frontend run check
  backend:
    name: 백엔드 DB·테스트·빌드 검사
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ needs.changes.outputs.backend == 'true' && 'postgres:18.6' || '' }}
        env:
          POSTGRES_DB: nadeulirang
          POSTGRES_USER: nadeulirang
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nadeulirang -d nadeulirang"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/nadeulirang
      DB_USERNAME: nadeulirang
      DB_PASSWORD: ci-only-password
    steps:
      - name: 경로 확인 실패를 성공으로 처리하지 않기
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success
      - name: 저장소 가져오기
        if: needs.changes.outputs.backend == 'true'
        uses: actions/checkout@v7
      - name: JDK 21 준비
        if: needs.changes.outputs.backend == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: 백엔드 DB·HTTP 테스트와 실행 JAR 빌드
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: ./mvnw -B -ntp verify
