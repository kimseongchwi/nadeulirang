name: 개발 검사
on:
  push:
    branches: [main, 'codex/**']
    paths: ['frontend/**', 'backend/**', 'scripts/**', 'tests/tooling/**', '.githooks/**', 'package.json', '.github/workflows/ci.yml', '!**/*.md']
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'backend/**', 'scripts/**', 'tests/tooling/**', '.githooks/**', 'package.json', '.github/workflows/ci.yml', '!**/*.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: 커밋 도구·프론트 검사
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v7
      - name: Node.js 준비
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 커밋 차단 테스트
        run: npm test
      - name: 프론트 의존성 설치
        run: npm ci --prefix frontend
      - name: 프론트 코드·타입·빌드 검사
        run: npm --prefix frontend run check
  backend:
    name: 백엔드 DB·테스트·빌드 검사
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: nadeulirang
          POSTGRES_USER: nadeulirang
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nadeulirang -d nadeulirang"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/nadeulirang
      DB_USERNAME: nadeulirang
      DB_PASSWORD: ci-only-password
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v7
      - name: JDK 21 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: 백엔드 DB·HTTP 테스트와 실행 JAR 빌드
        working-directory: backend
        run: ./mvnw -B -ntp verify
